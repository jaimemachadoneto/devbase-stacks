# Reusable workflow: build a Go app (a terminal app, a CLI) for Linux, macOS
# and Windows with GoReleaser, and attach the archives to the GitHub Release
# of a vX.Y.Z tag. Go cross-compiles, so one Linux runner builds them all.
# The project keeps its GoReleaser settings in .goreleaser.yaml.
name: go-release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: A release needs a version tag
        run: |
          case "$GITHUB_REF" in refs/tags/v[0-9]*) ;; *)
            echo "::error::go-release runs on a vX.Y.Z tag, not $GITHUB_REF"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
