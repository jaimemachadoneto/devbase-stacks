# Reusable workflow: the test suite of one project, in its own devenv shell.
#
# A project pins the public stacks repository as a devenv input and commits
# devenv.yaml, devenv.stacks.nix and devenv.lock. This workflow therefore needs
# no checkout of the private devbase repository and no token. It reads the
# project, installs Nix and devenv, and runs the same verbs as a laptop.
#
# Call it from a project:
#
#   jobs:
#     test:
#       uses: jaimemachadoneto/devbase-stacks/.github/workflows/project-ci.yaml@v0.3.0
name: project-ci

on:
  workflow_call:
    inputs:
      setup:
        description: An extra setup command for the project, such as "pnpm install --frozen-lockfile". The stack already installs its own dependencies.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # One shell runs setup, then check, then lint, so all three see the same
      # project venv. A separate `devenv test` step uses a different venv, and
      # lint then fails on imports that setup installed.
      - name: setup, check and lint
        env:
          # A string, not an expression inside the script: a quote in it must
          # not change the command.
          EXTRA_SETUP: ${{ inputs.setup }}
        run: |
          set -eu
          devenv shell -- bash -s <<'SCRIPT'
          set -eu
          setup
          if [ -n "${EXTRA_SETUP:-}" ]; then bash -c "$EXTRA_SETUP"; fi
          check
          lint
          SCRIPT
