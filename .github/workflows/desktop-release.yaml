# Reusable workflow: build a Tauri desktop app and attach the installers to
# the GitHub Release of a vX.Y.Z tag.
#
# Linux is always built. macOS and Windows are built only with
# `all-platforms: true`. Their runners are free for public repositories and
# cost more for private ones, so a private project builds them on its own
# machines (`build`) and uploads them with `gh release upload`.
#
# These runners have no Nix (Windows cannot run it), so the workflow installs
# Node, pnpm and Rust directly. The app still builds with the same command as
# on a laptop: `pnpm tauri build`.
name: desktop-release

on:
  workflow_call:
    inputs:
      all-platforms:
        description: Build macOS and Windows too. Use it for public repositories.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.all-platforms && '["ubuntu-22.04","macos-latest","windows-latest"]' || '["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: A release needs a version tag
        shell: bash
        run: |
          case "$GITHUB_REF" in refs/tags/v[0-9]*) ;; *)
            echo "::error::desktop-release runs on a vX.Y.Z tag, not $GITHUB_REF"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: WebKitGTK and its libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install the front-end dependencies
        run: pnpm install --frozen-lockfile

      # The tests run before the build, as `check` does on a laptop.
      - name: Test
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          pnpm test

      - name: Build and attach to the release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.event.repository.name }} ${{ github.ref_name }}
          releaseDraft: false
